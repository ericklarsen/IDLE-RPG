name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Headless simulation, save/migration, and UI helper tests.
      - name: Unit tests
        run: npm test

      # `build` runs `tsc --noEmit` first, so typecheck failures stop the job.
      - name: Typecheck and build
        run: npm run build

      # Initial-payload budget (460 KB gzip) — reads dist/, so it must follow build.
      - name: Bundle budget
        run: npm run check:bundle
